<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Коллапс">
<meta name="description" content="Материнский коллапс: таймер, СЛР, перимортальное КС, дифдиагностика и лечение со ссылками на КР РОАГ и ERC/AHA">
<title>Материнский коллапс</title>
<link rel="manifest" id="manifestLink" href="data:application/manifest+json,%7B%7D">
<link rel="apple-touch-icon" id="appleIcon" href="data:,">
<style>
:root{
  --bg:#ffffff; --fg:#000000; --panel:#efefef; --line:#000000;
  --red:#b3001b; --on-red:#ffffff;
  --yel:#ffd100; --on-yel:#000000;
  --grn:#00703c; --on-grn:#ffffff;
  --blu:#0047ab; --on-blu:#ffffff;
  --focus:#0047ab;
  --bar-h:58px; --tab-h:64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --fg:#ffffff; --panel:#1c1c1c; --line:#ffffff;
    --red:#ff5a5f; --on-red:#000000;
    --yel:#ffd100; --on-yel:#000000;
    --grn:#3ddc84; --on-grn:#000000;
    --blu:#7ab8ff; --on-blu:#000000;
    --focus:#ffd100; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --fg:#ffffff; --panel:#1c1c1c; --line:#ffffff;
  --red:#ff5a5f; --on-red:#000000;
  --yel:#ffd100; --on-yel:#000000;
  --grn:#3ddc84; --on-grn:#000000;
  --blu:#7ab8ff; --on-blu:#000000;
  --focus:#ffd100; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{line-height:1.15;margin:0}
h2{font-size:24px;font-weight:800;margin:18px 0 10px}
h3{font-size:18px;font-weight:800;margin:16px 0 8px}
p{margin:6px 0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* верхняя панель таймеров */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:3px solid var(--line);
  padding-top:env(safe-area-inset-top)}
#bar .cells{display:grid;grid-template-columns:repeat(4,1fr);min-height:var(--bar-h)}
#bar .cell{padding:4px 6px 5px;border-right:2px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
#bar .cell:last-child{border-right:0}
#bar .lb{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .vl{font-size:24px;font-weight:850;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
#bar .cell.red{background:var(--red);color:var(--on-red)}
#bar .cell.yel{background:var(--yel);color:var(--on-yel)}
#bar .cell.grn{background:var(--grn);color:var(--on-grn)}
#bar .idle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;min-height:var(--bar-h)}
#bar .idle b{font-size:16px}

main{padding:calc(var(--bar-h) + 14px + env(safe-area-inset-top)) 16px calc(var(--tab-h) + 26px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
main.withfork{padding-bottom:calc(var(--tab-h) + 112px + env(safe-area-inset-bottom))}

/* нижние вкладки */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:3px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{height:var(--tab-h);border:0;background:transparent;font-size:15px;font-weight:750;border-right:2px solid var(--line);padding:0 2px}
#tabs button:last-child{border-right:0}
#tabs button[aria-current="page"]{background:var(--fg);color:var(--bg)}

/* кнопки */
.btn{display:block;width:100%;min-height:60px;border:3px solid var(--line);background:var(--bg);border-radius:14px;
  font-size:19px;font-weight:800;padding:10px 14px;text-align:left}
.btn small{display:block;font-size:14.5px;font-weight:600;margin-top:2px}
.btn:active{transform:translateY(1px)}
.b-red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.b-yel{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.b-grn{background:var(--grn);color:var(--on-grn);border-color:var(--grn)}
.b-blu{background:var(--blu);color:var(--on-blu);border-color:var(--blu)}
.b-ink{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[disabled]{border-style:dashed;cursor:default}
.mini{min-height:44px;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px;font-weight:750;font-size:16px}
.mini.on{background:var(--fg);color:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.grid3 .btn{font-size:15.5px;min-height:56px;padding:8px;text-align:center;border-width:2px}
.stack>*+*{margin-top:10px}

/* старт */
.start h1{font-size:34px;font-weight:900;letter-spacing:-.01em;margin-top:8px}
.start .lead{font-size:18px;margin:8px 0 18px}
.go{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:46vh;border:0;border-radius:28px;
  background:var(--red);color:var(--on-red);font-size:56px;font-weight:900;letter-spacing:-.01em;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25)}
.go small{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:0}
.note{font-size:15px;border-left:5px solid var(--line);padding:6px 10px;margin:16px 0}

/* развилка */
.fork{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 3px + env(safe-area-inset-bottom));z-index:15;background:var(--bg);
  border-top:3px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fork .btn{min-height:84px;font-size:21px;text-align:center}

/* сегменты */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .btn{min-height:64px;font-size:16.5px;padding:8px;text-align:center}
.seg .btn small{font-size:13px}
.seg .btn.on{background:var(--fg);color:var(--bg)}
.wt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wt label{flex:1 1 100%;font-size:15px}
.wt input{width:110px;min-height:48px;border:3px solid var(--line);border-radius:10px;padding:6px 10px;font-size:20px;font-weight:800;background:var(--bg)}
.shift{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;margin:6px 0}
.shift .mini{min-height:40px;padding:4px 10px;font-size:15px}

/* пункты действий */
.act{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:12px 0;border-bottom:2px solid var(--line)}
.act.noc{grid-template-columns:1fr}
.chk{width:58px;height:58px;border:3px solid var(--line);border-radius:12px;background:var(--bg);font-size:28px;font-weight:900;line-height:1}
.chk[aria-pressed="true"]{background:var(--grn);color:var(--on-grn);border-color:var(--grn)}
.act .t{font-weight:700;margin:0}
.act .d{font-weight:800;margin:6px 0 0;padding:6px 9px;background:var(--panel);border-radius:8px}
.act .calc{margin:6px 0 0;padding:6px 9px;border:2px dashed var(--line);border-radius:8px;font-weight:700}
.act .x{font-size:15px;margin:6px 0 0;font-style:italic}
.src{font-size:14px;margin:6px 0 0}
.src b{font-weight:800}
.dv{margin:8px 0 0;padding:7px 10px;background:var(--yel);color:var(--on-yel);border-radius:8px;font-size:15px;font-weight:650}
.dv b{font-weight:850}
.when{display:inline-block;margin-top:6px;font-size:14px;font-weight:800;background:var(--grn);color:var(--on-grn);border-radius:6px;padding:1px 7px}
ul.sig{list-style:none;margin:0;padding:0}
ul.sig li{padding:9px 0;border-bottom:2px solid var(--line)}
ul.sig li:last-child{border-bottom:0}
.box{border:3px solid var(--line);border-radius:14px;padding:4px 14px 10px;margin:14px 0}
.box>h3{margin-top:12px}
details{border:3px solid var(--line);border-radius:14px;margin:12px 0;background:var(--bg)}
details>summary{list-style:none;padding:14px;font-weight:850;font-size:18px;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.2em;font-weight:900}
details[open]>summary::before{content:"−"}
details>.in{padding:0 14px 10px}

/* остановка */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 10px}
.pmcd{border-radius:16px;padding:10px 12px;border:3px solid var(--line);min-width:0}
.pmcd .big{font-size:clamp(38px,12vw,58px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;white-space:nowrap}
.pmcd .lbl{font-size:16px;font-weight:850;line-height:1.2;overflow-wrap:anywhere}
.pmcd .sub{font-size:14px;font-weight:700;margin-top:3px;line-height:1.25}
.pmcd .txt{font-size:16px;font-weight:750;margin-top:4px;line-height:1.3}
.pmcd.warn{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.pmcd.now{background:var(--red);color:var(--on-red);border-color:var(--red)}
.pmcd.ok{background:var(--grn);color:var(--on-grn);border-color:var(--grn)}
.cyc{border:3px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.cyc .big{font-size:clamp(38px,12vw,58px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;white-space:nowrap}
.cyc .lbl{font-size:16px;font-weight:850;line-height:1.2}
.cyc .sub{font-size:14px;font-weight:700;margin-top:3px}
.cyc.warn{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.cyc.now{background:var(--red);color:var(--on-red);border-color:var(--red)}
.prompt{margin:10px 0}
.prompt p{margin:6px 0;padding:8px 10px;border-radius:10px;font-weight:800}
.prompt .pr{background:var(--red);color:var(--on-red)}
.prompt .py{background:var(--yel);color:var(--on-yel)}
.prompt .pb{border:2px solid var(--line)}
.rosc{background:var(--grn);color:var(--on-grn);border-radius:16px;padding:12px 14px;margin:6px 0 12px;font-weight:800;font-size:20px}
@media (prefers-reduced-motion: no-preference){
  .pulse{animation:pulse 1s steps(2,end) infinite}
  @keyframes pulse{50%{box-shadow:inset 0 0 0 6px var(--fg)}}
}

/* причины */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.cause{border:3px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.cause .cn{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px 4px;font-weight:850;font-size:18px}
.cause .cn span{display:block;font-size:13.5px;font-weight:650;margin-top:2px}
.cause .cn i{font-style:normal;font-size:28px;font-weight:900;line-height:1}
.cause.y{border-color:var(--grn);box-shadow:inset 8px 0 0 var(--grn)}
.cause.q{border-color:var(--yel);box-shadow:inset 8px 0 0 var(--yel)}
.cause.n .cn b{text-decoration:line-through;text-decoration-thickness:3px}
.st3{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:6px;padding:6px 10px 10px}
.st3 button{min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:14px;font-weight:800;padding:4px 2px;white-space:nowrap}
.st3.solo{padding:8px 0 4px}
.st3 button.y.on{background:var(--grn);color:var(--on-grn);border-color:var(--grn)}
.st3 button.q.on{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
.st3 button.n.on{background:var(--fg);color:var(--bg)}
.back{margin-top:4px}
.sum{font-size:15.5px;font-weight:700;margin:6px 0}

/* журнал */
ol.log{list-style:none;padding:0;margin:10px 0}
ol.log li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:2px solid var(--line)}
ol.log .tm{font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
ol.log .clk{display:block;font-size:13px;font-weight:600}
textarea{width:100%;min-height:76px;border:3px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font-size:17px}
::placeholder{color:var(--fg);opacity:1;font-style:italic}
.fallback{width:100%;min-height:220px;font-size:14px}

/* справка */
.ref dt{font-weight:850;margin-top:12px}
.ref dd{margin:2px 0 0}
table.dvt{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 4px}
table.dvt td{border:2px solid var(--line);padding:6px 8px;vertical-align:top}
table.dvt td:first-child{font-weight:800;width:42%}

#toast{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 3px + env(safe-area-inset-bottom));z-index:40;background:var(--fg);color:var(--bg);
  padding:8px 12px;font-weight:800;font-size:15px;display:none;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{display:block}
.hide{display:none!important}
@media (min-width:600px){ .seg{grid-template-columns:repeat(3,1fr)} #bar .vl{font-size:28px} }
@media (max-width:359px){ #bar .vl{font-size:20px} #bar .lb{font-size:11.5px} .grid3{grid-template-columns:1fr 1fr} }
</style>
</head>

  <button data-a="nav" data-v="more">Ещё</button>
</nav>

function due(key, at, n, fn){ if(n >= at && !S.fired[key]){ S.fired[key] = 1; if(n - at < 6000) fn(); return true; } return false; }
function checkAlerts(n){
  var a = S.arrest; if(!a || a.rosc || a.ended) return;
  var msgs = [], dirty = false, m = Math.floor((n - a.start) / 60000);
  var pmcdOn = S.preg === 'ge20' && !a.delivered;
  if(pmcdOn){
    dirty = due('p3:' + a.start, a.start + 180000, n, function(){ msgs.push('Три минуты остановки. Через минуту — кесарево сечение.'); }) || dirty;
    dirty = due('p4:' + a.start, a.start + PMCD_DEC, n, function(){ msgs.push('Четыре минуты. Начать кесарево сечение.'); beep(4); vib(); }) || dirty;
    dirty = due('p5:' + a.start, a.start + PMCD_GOAL, n, function(){ msgs.push('Пять минут остановки. Извлечь плод.'); beep(2); }) || dirty;
  }
  if(SET.minute && m >= 1 && !(pmcdOn && m >= 3 && m <= 5)){
    dirty = due('m' + m + ':' + a.start, a.start + m * 60000, n, function(){ msgs.unshift('Остановка: ' + minWord(m) + '.'); }) || dirty;
  } else if(m >= 1){ S.fired['m' + m + ':' + a.start] = 1; }
  dirty = due('c10:' + a.cycle, a.cycle + CYCLE - 10000, n, function(){ msgs.push('Десять секунд до проверки ритма. Зарядить дефибриллятор.'); }) || dirty;
  dirty = due('c0:' + a.cycle, a.cycle + CYCLE, n, function(){ msgs.push('Проверка ритма. Смена компрессора.'); beep(3); vib(); }) || dirty;
  var last = a.adr.length ? a.adr[a.adr.length - 1] : null;
  if(last){
    dirty = due('a3:' + last, last + 180000, n, function(){ msgs.push('Три минуты после адреналина.'); }) || dirty;
    dirty = due('a5:' + last, last + 300000, n, function(){ msgs.push('Пять минут после адреналина. Повторить адреналин.'); beep(2); }) || dirty;
  }
  if(dirty) save();
  if(msgs.length) speak(msgs.join(' '));
}

  copy: function(){ var txt = logText(); var ok = function(){ S.copied = S.log.length; save(); toast('Журнал скопирован'); };
    var fb = function(){ var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      var res = false; try{ res = document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
      if(res) ok(); else { var h = $('copyFallback'); if(h){ h.innerHTML = '<p><b>Автокопирование недоступно.</b> Выделите текст и скопируйте вручную:</p><textarea class="fallback" readonly>' + esc(txt) + '</textarea>'; var t2 = h.querySelector('textarea'); t2.focus(); t2.select(); } } };
    try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(ok, fb); } else fb(); }catch(e){ fb(); } },
  undo: function(){ if(!S.log.length) return; if(!arm('undo')){ var b = $('undoBtn'); if(b) b.innerHTML = 'Нажмите ещё раз<small>удалить: ' + esc(S.log[S.log.length - 1].m.slice(0, 40)) + '</small>'; return; }
    var e = S.log[S.log.length - 1]; if(S.log.length === 1){ toast('Первую запись не удалить — используйте «Завершить и очистить»'); return; }
    S.log.pop(); revert(e.u); save(); toast('Удалено: ' + e.m); render(); },
  reset: function(){ var b = $('resetBtn'); if(!arm('reset', 5000)){ if(b) b.innerHTML = 'Нажмите ещё раз — удалить<small>' + (S.copied === S.log.length ? 'журнал скопирован' : 'журнал НЕ скопирован после последней записи') + '</small>'; return; }
    S = blank(); save(); try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} nav('start'); },
  theme: function(v){ SET.theme = v; saveSet(); render(); },
  voice: function(){ SET.voice = !SET.voice; saveSet(); if(SET.voice){ unlock(); speak('Голосовые подсказки включены.'); } render(); },
  minute: function(){ SET.minute = !SET.minute; saveSet(); render(); },
  testvoice: function(){ unlock(); beep(2); vib(); var was = SET.voice; SET.voice = true; speak('Проверка голоса. Проверка ритма через десять секунд.'); SET.voice = was; }
};
function revert(u){ if(!u) return; var a = S.arrest;
  switch(u.k){
    case 'done': delete S.done[u.key]; break;
    case 'undone': S.done[u.key] = u.prev; break;
    case 'cst': if(u.prev) S.causes[u.id] = u.prev; else delete S.causes[u.id]; break;
    case 'preg': S.preg = u.prev; break;
    case 'wt': S.wt = u.prev; break;
    case 'shiftC': S.t0 += u.ms; break;
    case 'shiftA': if(a) a.start += u.ms; break;
    case 'arrest': S.arrest = null; break;
    case 'rearrest': if(a){ a.rosc = u.prev.rosc; a.ended = u.prev.ended; a.cycle = u.prev.cycle; } break;
    case 'rhythm': if(a){ a.rhythm = u.prev.rhythm; a.cycle = u.prev.cycle; } break;
    case 'shock': if(a){ a.shocks = Math.max(0, a.shocks - 1); a.cycle = u.prev.cycle; a.rhythm = u.prev.rhythm; } break;
    case 'adr': if(a) a.adr.pop(); break;
    case 'amio': if(a) a.amio.pop(); break;
    case 'cycle': if(a) a.cycle = u.prev.cycle; break;
    case 'rosc': if(a) a.rosc = null; break;
    case 'deliv': if(a) a.delivered = null; break;
    case 'ended': if(a) a.ended = null; break;
  } }
document.addEventListener('click', function(e){ var b = e.target.closest ? e.target.closest('[data-a]') : null; if(!b) return;
  var f = A[b.getAttribute('data-a')]; if(f){ e.preventDefault(); f(b.getAttribute('data-v'), b); } });
document.addEventListener('keydown', function(e){ if(e.key === 'Enter' && e.target && e.target.id === 'wtIn'){ A.wtset(); } });
document.addEventListener('change', function(e){ if(e.target && e.target.id === 'wtIn' && String(e.target.value).trim()) A.wtset(); });

/* ---------------- PWA: манифест, иконка, service worker ---------------- */
function icon(size){ try{ var c = document.createElement('canvas'); c.width = c.height = size; var g = c.getContext('2d'); if(!g) return null;
  g.fillStyle = '#b3001b'; g.fillRect(0, 0, size, size); g.fillStyle = '#ffffff'; var u = size / 8;
  g.fillRect(u * 3.1, u * 1.4, u * 1.8, u * 5.2); g.fillRect(u * 1.4, u * 3.1, u * 5.2, u * 1.8); return c.toDataURL('image/png'); }catch(e){ return null; } }
function pwa(){
  try{ var i192 = icon(192), i512 = icon(512);
    var base = location.href.split('#')[0];
    var man = {name:'Материнский коллапс', short_name:'Коллапс', start_url: base, scope: base.replace(/[^\/]*$/, ''), display:'standalone', background_color:'#000000', theme_color:'#000000', lang:'ru',
      icons: i192 ? [{src:i192, sizes:'192x192', type:'image/png'}, {src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}] : []};
    $('manifestLink').setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
    if(i192) $('appleIcon').setAttribute('href', i192);
  }catch(e){}
  try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(function(){}); } }catch(e){}
}

/* ---------------- запуск ---------------- */
window.__mcTick = tick; window.__mcState = function(){ return S; }; window.__mcLogText = logText; window.__mcRender = render;
render(); pwa(); keepAwake();
setInterval(tick, 250);
try{ if(window.speechSynthesis && window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', function(){}); }catch(e){}
document.addEventListener('pointerdown', function once(){ unlock(); document.removeEventListener('pointerdown', once); });
})();
</script>
